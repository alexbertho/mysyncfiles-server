[workspace]
members = ["crates/protocol"]
exclude = ["integration"]
resolver = "2"

[package]
name = "mysyncfiles-server"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Server-authoritative Linux file synchronization server"

[[bin]]
name = "mysync-server"
path = "src/bin/mysync-server.rs"

[dependencies]
mysync-protocol = { path = "crates/protocol", version = "0.4.0" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
openssl = "0.10"
url = "2"
rpassword = "7"
rustix = { version = "1", features = ["fs"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tokio = {
    version = "1",
    features = [
        "fs",
        "io-util",
        "macros",
        "net",
        "process",
        "rt-multi-thread",
        "signal",
        "sync",
        "time",
    ],
}
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"


[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
walkdir = "2"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
