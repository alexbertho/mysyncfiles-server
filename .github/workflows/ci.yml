name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tpm-integration:
    uses: ./.github/workflows/integration.yml
  web-status-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/mysync-browser" --no-save playwright@1.60.0
          node "$RUNNER_TEMP/mysync-browser/node_modules/playwright/cli.js" install --with-deps chromium firefox
      - name: Status page and loopback transport
        run: NODE_PATH="$RUNNER_TEMP/mysync-browser/node_modules" node tests/web_status_browser.cjs
      - name: Atlas file explorer
        run: NODE_PATH="$RUNNER_TEMP/mysync-browser/node_modules" node tests/web_files_browser.cjs
      - name: Reproducible editor bundle
        run: make editor-check
      - name: Atlas code editor
        run: NODE_PATH="$RUNNER_TEMP/mysync-browser/node_modules" node tests/web_editor_browser.cjs
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Install server build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Format and test
        run: make test
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build server binary
        run: cargo build --release --locked --bin mysync-server
      - name: Build server image
        run: >-
          docker build -f deploy/Dockerfile
          --label org.opencontainers.image.revision="$GITHUB_SHA"
          -t "mysyncfiles-server:git-$GITHUB_SHA" .
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file Cargo.lock
      - name: Build generic deployment documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          install -d -m 0755 site
          docker compose --env-file deploy/.env.example -f deploy/compose.yaml --profile docs run --rm \
            --user "$(id -u):$(id -g)" --volume "$PWD/site:/workspace/site" \
            --env MYSYNC_PUBLIC_URL=https://sync.example.org \
            --env MYSYNC_DOCS_SITE_URL=https://sync.example.org/docs/ docs build --strict
      - name: Package immutable deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 deploy/cicd/package.py
      - name: Store deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-${{ github.sha }}
          path: release/
          retention-days: 7
          compression-level: 1
          if-no-files-found: error
